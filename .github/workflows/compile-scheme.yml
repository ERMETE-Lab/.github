name: Compile Scheme to SVG

on:
  push:
    paths:
      - 'scheme/ermete_scheme.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX and pdf2svg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            pdf2svg

      - name: Compile TeX to PDF and convert to SVG
        working-directory: scheme
        run: |
          pdflatex -interaction=nonstopmode ermete_scheme.tex
          pdf2svg ermete_scheme.pdf ../ermete_scheme.svg

      - name: Commit and push generated SVG and PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aggiunge l'SVG nella root e il PDF dentro la cartella scheme
          git add ermete_scheme.svg scheme/ermete_scheme.pdf
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update scheme SVG/PDF [skip ci]" && git push)